<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="784" viewBox="0 0 1040 784" role="img" aria-labelledby="title desc">
  <title id="title">B0: from NanoAOD to checked ROOT skims</title>
  <desc id="desc">2024 TT2Q, TTCB or TTBB NanoAOD enters the B0 processor. C1 companion files supply complete-generator extra-b counts. Correct and select objects, prepare observable features, and attach two truth labels and four distinct jet assignments using greedy delta-R below 0.4. Keep selected events with incomplete matching. Save ROOT events, all-input normalization totals and provenance. Separate steps make matching counts and W/top mass plots, and normalize using the complete dataset. Dataset assembly and SPANet training follow downstream.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526279"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172b42; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
      .connector { fill: none; stroke: #526279; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="784" rx="18" fill="#ffffff"/>

  <!-- Inputs. CMSSW_CHARGE conversion and C1 truth preparation happen upstream. -->
  <rect x="40" y="32" width="460" height="110" rx="14" fill="#edf5ff" stroke="#9bbce1" stroke-width="1.5"/>
  <text x="62" y="67" class="heading">2024 CMSSW_CHARGE NanoAOD</text>
  <text x="62" y="99" class="body">TT2Q · TTCB · TTBB</text>
  <text x="62" y="124" class="body">Jets, leptons, MET and retained truth</text>
  <rect x="540" y="32" width="460" height="110" rx="14" fill="#edf8f3" stroke="#93bca8" stroke-width="1.5"/>
  <text x="562" y="67" class="heading">Complete generator truth</text>
  <text x="562" y="99" class="body">C1 companion files</text>
  <text x="562" y="124" class="body">Required for valid extra-b-quark counts</text>
  <path d="M 200 142 V 192" class="connector"/>
  <path d="M 850 142 V 192" class="connector"/>

  <!-- Logical processing stages, rather than a literal call-order diagram. -->
  <rect x="40" y="194" width="960" height="234" rx="16" fill="#f5f8fc" stroke="#c7d3e2" stroke-width="1.5"/>
  <text x="64" y="227" class="label">CALIB_CHARGETAGGER_JH · B0 MODE</text>
  <line x1="64" y1="242" x2="976" y2="242" stroke="#c7d3e2"/>
  <text x="64" y="278" class="heading">1. Correct &amp; select</text>
  <text x="64" y="309" class="body">Trigger, lepton and quality cuts</text>
  <text x="64" y="336" class="body">≥4 jets: pT &gt; 25 GeV, |η| &lt; 2.4</text>
  <text x="64" y="363" class="body">Keep the leading 10 jets</text>
  <path d="M 346 318 H 376" class="connector"/>
  <text x="392" y="278" class="heading">2. Prepare features</text>
  <text x="392" y="309" class="body">Jet kinematics, tags and charge</text>
  <text x="392" y="336" class="body">Lepton, MET and event features</text>
  <text x="392" y="363" class="body">Record missing-value masks</text>
  <path d="M 674 318 H 704" class="connector"/>
  <text x="720" y="278" class="heading">3. Label &amp; match</text>
  <text x="720" y="309" class="body">W decay + extra-b count</text>
  <text x="720" y="336" class="body">4 roles; greedy ΔR &lt; 0.4</text>
  <text x="720" y="363" class="body">Unordered W-jet pair</text>
  <rect x="56" y="384" width="928" height="32" rx="7" fill="#e0edf5"/>
  <text x="520" y="406" text-anchor="middle" class="body">Keep incomplete matches. Reconstruction and classification use separate validity masks.</text>

  <path d="M 520 428 V 470" class="connector"/>
  <rect x="260" y="472" width="520" height="96" rx="14" fill="#183c5c"/>
  <text x="520" y="509" text-anchor="middle" class="heading" style="fill:#ffffff">ROOT skims + companion metadata</text>
  <text x="520" y="541" text-anchor="middle" class="body" style="fill:#e4eff9">Selected events · all-input totals · provenance</text>

  <!-- Reports use selected rows; normalization uses totals from every input row. -->
  <path d="M 520 568 V 592 H 270 V 618" class="connector"/>
  <path d="M 520 592 H 770 V 618" class="connector"/>
  <rect x="40" y="620" width="460" height="100" rx="14" fill="#fff7e8" stroke="#dec18b" stroke-width="1.5"/>
  <text x="62" y="654" class="heading">Optional: check matching</text>
  <text x="62" y="684" class="body">Full and hadronic-top matching counts</text>
  <text x="62" y="708" class="body">W/top mass plots from matched jets</text>
  <rect x="540" y="620" width="460" height="100" rx="14" fill="#f2effb" stroke="#b5a6d5" stroke-width="1.5"/>
  <text x="562" y="654" class="heading">After all files: normalize</text>
  <text x="562" y="684" class="body">Add finalWeight for event yields</text>
  <text x="562" y="708" class="body">Use totals including rejected events</text>
  <text x="520" y="759" text-anchor="middle" class="body">Downstream work: assemble the training dataset → train SPANet</text>
</svg>
